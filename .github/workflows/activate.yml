name: Generate Unity Activation File

on:
  workflow_dispatch:

jobs:
  generate-alf:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation file via Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            unityci/editor:ubuntu-2021.3.35f1-base-3 \
            bash -c "unity-editor -createManualActivationFile -logFile - && ls -la *.alf"

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: "*.alf"
          retention-days: 3

      - name: Activate via unity-license-activate
        run: |
          npm install -g unity-license-activate
          ALF_FILE=$(ls *.alf | head -1)
          unity-license-activate \
            "${{ secrets.UNITY_EMAIL }}" \
            "${{ secrets.UNITY_PASSWORD }}" \
            "$ALF_FILE" \
            --output "Unity_lic.ulf"

      - name: Upload license file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-License-File
          path: Unity_lic.ulf
          retention-days: 30
