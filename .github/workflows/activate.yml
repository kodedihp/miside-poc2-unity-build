name: Generate Unity Activation File

on:
  workflow_dispatch:

jobs:
  generate-alf:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation file via Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            unityci/editor:ubuntu-2021.3.35f1-base-3 \
            bash -c "unity-editor -createManualActivationFile -logFile - && ls -la *.alf"

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: "*.alf"
          retention-days: 3
